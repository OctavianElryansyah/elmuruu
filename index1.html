<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-light">
    <div id="app"></div>

    <script type="text/jsx">
        const { useState } = React;

        function AppTodolist() {
            const [activity, setActivity] = useState("");
            const [todos, setTodos] = useState([]);
            const [editIndex, setEditIndex] = useState(null);
            const [editValue, setEditValue] = useState("");

            function handleChange(e) {
                setActivity(e.target.value);
            }

            function handleSubmit(e) {
                e.preventDefault();
                if (activity.trim() === "") return;
                setTodos([...todos, activity]);
                setActivity("");
            }

            function handleDelete(index) {
                const newTodos = todos.filter((_, i) => i !== index);
                setTodos(newTodos);
            }

            function handleEdit(index) {
                setEditIndex(index);
                setEditValue(todos[index]);
            }

            function handleSave(index) {
                const newTodos = [...todos];
                newTodos[index] = editValue;
                setTodos(newTodos);
                setEditIndex(null);
                setEditValue("");
            }

            function handleCancel() {
                setEditIndex(null);
                setEditValue("");
            }

            return (
                <div className="container mt-5">
                    <div className="card shadow p-4">
                        <h1 className="text-center mb-4">📌 Todo List</h1>
                        
                        <form onSubmit={handleSubmit} className="d-flex">
                            <input 
                                type="text" 
                                className="form-control" 
                                placeholder="Masukkan aktivitas" 
                                value={activity} 
                                onChange={handleChange} 
                            />
                            <button className="btn btn-success ms-2">Tambah</button>
                        </form>

                        <ul className="list-group mt-4">
                            {todos.map((todo, index) => (
                                <li key={index} className="list-group-item d-flex justify-content-between align-items-center">
                                    {editIndex === index ? (
                                        <>
                                            <input 
                                                type="text" 
                                                className="form-control me-2"
                                                value={editValue} 
                                                onChange={(e) => setEditValue(e.target.value)} 
                                            />
                                            <button className="btn btn-success me-2" onClick={() => handleSave(index)}>✅</button>
                                            <button className="btn btn-danger" onClick={handleCancel}>❌</button>
                                        </>
                                    ) : (
                                        <>
                                            <span>{todo}</span>
                                            <div>
                                                <button className="btn btn-warning btn-sm me-2" onClick={() => handleEdit(index)}>✏️</button>
                                                <button className="btn btn-danger btn-sm" onClick={() => handleDelete(index)}>🗑</button>
                                            </div>
                                        </>
                                    )}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("app"));
        root.render(<AppTodolist />);
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
