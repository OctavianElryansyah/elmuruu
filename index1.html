<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin-left: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            border: none;
        }

        .add-btn {
            background: #28a745;
            color: white;
        }

        .add-btn:hover {
            background: #218838;
        }

        .edit-btn {
            background: #ffc107;
            color: white;
        }

        .edit-btn:hover {
            background: #e0a800;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #fafafa;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/jsx">
        const { useState } = React;

        function AppTodolist() {
            const [activity, setActivity] = useState("");
            const [todos, setTodos] = useState([]);
            const [editIndex, setEditIndex] = useState(null);
            const [editValue, setEditValue] = useState("");

            function handleChange(e) {
                setActivity(e.target.value);
            }

            function handleSubmit(e) {
                e.preventDefault();
                if (activity.trim() === "") return;
                setTodos([...todos, activity]);
                setActivity("");
            }

            function handleDelete(index) {
                const newTodos = todos.filter((_, i) => i !== index);
                setTodos(newTodos);
            }

            function handleEdit(index) {
                setEditIndex(index);
                setEditValue(todos[index]);
            }

            function handleSave(index) {
                const newTodos = [...todos];
                newTodos[index] = editValue;
                setTodos(newTodos);
                setEditIndex(null);
                setEditValue("");
            }

            function handleCancel() {
                setEditIndex(null);
                setEditValue("");
            }

            return (
                <div className="container">
                    <h1>Todo List</h1>
                    <form onSubmit={handleSubmit}>
                        <input 
                            type="text" 
                            placeholder="Masukkan aktivitas" 
                            value={activity} 
                            onChange={handleChange} 
                        />
                        <button className="add-btn" type="submit">Tambah</button>
                    </form>

                    <ul>
                        {todos.map((todo, index) => (
                            <li key={index}>
                                {editIndex === index ? (
                                    <>
                                        <input 
                                            type="text" 
                                            value={editValue} 
                                            onChange={(e) => setEditValue(e.target.value)} 
                                        />
                                        <button className="add-btn" onClick={() => handleSave(index)}>✅</button>
                                        <button className="delete-btn" onClick={handleCancel}>❌</button>
                                    </>
                                ) : (
                                    <>
                                        {todo} 
                                        <div>
                                            <button className="edit-btn" onClick={() => handleEdit(index)}>✏️</button>
                                            <button className="delete-btn" onClick={() => handleDelete(index)}>🗑</button>
                                        </div>
                                    </>
                                )}
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("app"));
        root.render(<AppTodolist />);
    </script>
</body>
</html>
